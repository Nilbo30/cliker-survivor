<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicker Survivor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0010;
    color: #e0d0c0;
    font-family: 'Raleway', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
  }

  /* Background ambiance */
  #game-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(80, 20, 120, 0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(60, 10, 80, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(100, 30, 60, 0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .game-layer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 500px;
    padding: 20px;
  }

  /* Header stats */
  #stats-panel {
    width: 100%;
    background: rgba(20, 5, 35, 0.8);
    border: 1px solid rgba(200, 170, 80, 0.3);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .stat-row:last-child { margin-bottom: 0; }

  .stat-label {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: #c8aa50;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 600;
    color: #f0e6d0;
  }

  /* Progress bars */
  .bar-container {
    width: 100%;
    height: 16px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
    border: 1px solid rgba(200, 170, 80, 0.2);
  }

  .bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.3s ease, background 0.3s ease;
  }

  #xp-bar-fill {
    background: linear-gradient(90deg, #c8aa50, #f0d060);
  }

  #endurance-bar-fill {
    background: linear-gradient(90deg, #40c040, #60e060);
  }

  /* Souls panel */
  #souls-panel {
    width: 100%;
    text-align: center;
    margin-bottom: 16px;
    padding: 8px;
    background: rgba(80, 20, 120, 0.3);
    border: 1px solid rgba(150, 80, 200, 0.3);
    border-radius: 8px;
  }

  #souls-panel .stat-label {
    color: #c080f0;
  }

  #souls-panel .stat-value {
    color: #d0a0ff;
    font-size: 20px;
  }

  /* Click button */
  #click-area {
    position: relative;
    margin: 20px 0 30px;
  }

  #click-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #c8aa50;
    background: radial-gradient(circle at 40% 35%, #3a1860, #1a0830 70%);
    box-shadow:
      0 0 30px rgba(200, 170, 80, 0.3),
      0 0 60px rgba(100, 40, 140, 0.2),
      inset 0 0 30px rgba(200, 170, 80, 0.1);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: #c8aa50;
    text-shadow: 0 0 10px rgba(200, 170, 80, 0.5);
    letter-spacing: 2px;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    position: relative;
    overflow: hidden;
  }

  #click-btn:hover {
    box-shadow:
      0 0 40px rgba(200, 170, 80, 0.5),
      0 0 80px rgba(100, 40, 140, 0.3),
      inset 0 0 40px rgba(200, 170, 80, 0.15);
  }

  #click-btn:active {
    transform: scale(0.93);
    box-shadow:
      0 0 20px rgba(200, 170, 80, 0.6),
      0 0 40px rgba(100, 40, 140, 0.4),
      inset 0 0 50px rgba(200, 170, 80, 0.2);
  }

  #click-btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(200, 170, 80, 0.15) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }

  #click-btn:active::after {
    opacity: 1;
  }

  /* Floating text */
  .float-text {
    position: absolute;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 22px;
    color: #f0d060;
    text-shadow: 0 0 8px rgba(200, 170, 80, 0.6);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    z-index: 100;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-40px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
  }

  /* Skills list (current run) */
  #skills-display {
    width: 100%;
    max-height: 120px;
    overflow-y: auto;
    padding: 8px;
    font-size: 12px;
    color: #a090b0;
  }

  #skills-display::-webkit-scrollbar { width: 4px; }
  #skills-display::-webkit-scrollbar-thumb { background: rgba(200,170,80,0.3); border-radius: 2px; }

  .skill-tag {
    display: inline-block;
    background: rgba(80, 40, 120, 0.4);
    border: 1px solid rgba(150, 100, 200, 0.3);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px;
    font-size: 11px;
    color: #c0a0e0;
  }

  /* Overlay */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 0, 15, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    flex-direction: column;
  }

  .overlay.active {
    display: flex;
  }

  .overlay-content {
    background: rgba(20, 8, 40, 0.95);
    border: 2px solid rgba(200, 170, 80, 0.4);
    border-radius: 16px;
    padding: 30px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }

  .overlay-title {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 900;
    color: #c8aa50;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(200, 170, 80, 0.4);
  }

  /* Skill choice cards */
  .skill-choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }

  .skill-card {
    background: rgba(40, 15, 70, 0.8);
    border: 1px solid rgba(200, 170, 80, 0.3);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }

  .skill-card:hover {
    background: rgba(60, 25, 100, 0.9);
    border-color: #c8aa50;
    box-shadow: 0 0 15px rgba(200, 170, 80, 0.2);
    transform: translateY(-2px);
  }

  .skill-card-name {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    color: #f0d060;
    margin-bottom: 4px;
  }

  .skill-card-desc {
    font-size: 13px;
    color: #b0a0c0;
  }

  /* Death screen */
  .death-info {
    margin: 16px 0;
    font-size: 16px;
    line-height: 1.8;
    color: #d0c0e0;
  }

  .death-info span {
    color: #f0d060;
    font-weight: 600;
  }

  .souls-earned {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: #d0a0ff;
    margin: 12px 0;
    text-shadow: 0 0 10px rgba(180, 100, 240, 0.4);
  }

  /* Prestige panel */
  .prestige-upgrades {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
    text-align: left;
  }

  .prestige-upgrade {
    background: rgba(40, 15, 70, 0.6);
    border: 1px solid rgba(150, 80, 200, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .prestige-upgrade-info {
    flex: 1;
  }

  .prestige-upgrade-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: #d0a0ff;
    margin-bottom: 2px;
  }

  .prestige-upgrade-desc {
    font-size: 12px;
    color: #9080a0;
  }

  .prestige-buy-btn {
    padding: 8px 16px;
    background: rgba(80, 30, 130, 0.8);
    border: 1px solid rgba(200, 170, 80, 0.4);
    border-radius: 6px;
    color: #c8aa50;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .prestige-buy-btn:hover:not(:disabled) {
    background: rgba(100, 40, 160, 0.9);
    border-color: #f0d060;
    box-shadow: 0 0 10px rgba(200, 170, 80, 0.3);
  }

  .prestige-buy-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .prestige-buy-btn.sold-out {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: rgba(100, 80, 60, 0.3);
  }

  /* New run button */
  .btn-primary {
    margin-top: 16px;
    padding: 14px 40px;
    background: linear-gradient(135deg, #3a1860, #5a2090);
    border: 2px solid #c8aa50;
    border-radius: 10px;
    color: #f0d060;
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 8px rgba(200, 170, 80, 0.4);
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, #4a2070, #6a30a0);
    box-shadow: 0 0 20px rgba(200, 170, 80, 0.3);
    transform: translateY(-2px);
  }

  /* Particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
    animation: particleFade 0.6s ease-out forwards;
  }

  @keyframes particleFade {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  /* Level up glow */
  @keyframes levelGlow {
    0% { box-shadow: 0 0 30px rgba(200,170,80,0.3), 0 0 60px rgba(100,40,140,0.2); }
    50% { box-shadow: 0 0 60px rgba(200,170,80,0.8), 0 0 120px rgba(240,208,96,0.4); }
    100% { box-shadow: 0 0 30px rgba(200,170,80,0.3), 0 0 60px rgba(100,40,140,0.2); }
  }

  .level-up-glow {
    animation: levelGlow 0.6s ease;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="game-layer">
    <!-- Souls -->
    <div id="souls-panel">
      <div class="stat-row">
        <span class="stat-label">Ames</span>
        <span class="stat-value" id="souls-val">0</span>
      </div>
    </div>

    <!-- Stats -->
    <div id="stats-panel">
      <div class="stat-row">
        <span class="stat-label">Niveau</span>
        <span class="stat-value" id="level-val">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Points</span>
        <span class="stat-value"><span id="points-val">0</span> / <span id="points-next">50</span></span>
      </div>
      <div class="bar-container">
        <div class="bar-fill" id="xp-bar-fill" style="width: 0%"></div>
      </div>
      <div class="stat-row" style="margin-top: 10px">
        <span class="stat-label">Endurance</span>
        <span class="stat-value"><span id="endurance-val">100</span> / <span id="endurance-max-val">100</span></span>
      </div>
      <div class="bar-container">
        <div class="bar-fill" id="endurance-bar-fill" style="width: 100%"></div>
      </div>
    </div>

    <!-- Click button -->
    <div id="click-area">
      <button id="click-btn">FRAPPER</button>
    </div>

    <!-- Active skills -->
    <div id="skills-display"></div>
  </div>
</div>

<!-- Level up overlay -->
<div class="overlay" id="levelup-overlay">
  <div class="overlay-content">
    <div class="overlay-title">Niveau superieur !</div>
    <p style="color: #b0a0c0; margin-bottom: 8px;">Choisissez une competence :</p>
    <div class="skill-choices" id="skill-choices"></div>
  </div>
</div>

<!-- Death overlay -->
<div class="overlay" id="death-overlay">
  <div class="overlay-content">
    <div class="overlay-title">Vous etes tombe...</div>
    <div class="death-info">
      Niveau atteint : <span id="death-level">1</span><br>
      <div class="souls-earned">+ <span id="death-souls">0</span> Ames</div>
    </div>
    <hr style="border-color: rgba(200,170,80,0.2); margin: 16px 0;">
    <div class="overlay-title" style="font-size: 20px;">Upgrades Prestige</div>
    <div style="color:#9080a0; font-size:14px; margin-bottom:8px;">Ames disponibles : <span id="prestige-souls" style="color:#d0a0ff;">0</span></div>
    <div class="prestige-upgrades" id="prestige-upgrades"></div>
    <button class="btn-primary" id="new-run-btn">Nouvelle Run</button>
  </div>
</div>

<script>
(function() {
  // ========== SKILL DEFINITIONS ==========
  const BASE_SKILLS = [
    { id: 'robustesse', name: 'Robustesse', desc: 'Endurance max +20', effect: { maxEndurance: 20 } },
    { id: 'efficacite', name: 'Efficacite', desc: 'Cout par clic -0.5 (min 0.1)', effect: { costReduction: 0.5 } },
    { id: 'frappe_lourde', name: 'Frappe lourde', desc: 'Points par clic +50%', effect: { pointsMultAdd: 0.5 } },
    { id: 'second_souffle', name: 'Second souffle', desc: 'Regagne 15 endurance a chaque montee de niveau', effect: { levelHeal: 15 } },
    { id: 'frenesie', name: 'Frenesie', desc: 'Points par clic +100% mais cout par clic +0.5', effect: { pointsMultAdd: 1.0, costIncrease: 0.5 } },
    { id: 'endurance_fer', name: 'Endurance de fer', desc: 'Endurance max +50', effect: { maxEndurance: 50 } },
    { id: 'precision', name: 'Precision', desc: 'Points par clic +25% et cout par clic -0.25', effect: { pointsMultAdd: 0.25, costReduction: 0.25 } },
  ];

  const BONUS_SKILLS = [
    { id: 'vampirisme', name: 'Vampirisme', desc: 'Regagne 0.5 endurance par clic', effect: { healPerClick: 0.5 } },
    { id: 'rage', name: 'Rage', desc: 'Points par clic +75%, cout -0.3', effect: { pointsMultAdd: 0.75, costReduction: 0.3 } },
  ];

  // ========== PRESTIGE DATA ==========
  function loadPrestige() {
    const raw = localStorage.getItem('clicker_survivor_prestige');
    if (raw) return JSON.parse(raw);
    return { souls: 0, enduranceBonus: 0, pointsMult: 1.0, expandedPool: false };
  }

  function savePrestige() {
    localStorage.setItem('clicker_survivor_prestige', JSON.stringify(prestige));
  }

  let prestige = loadPrestige();

  // ========== GAME STATE ==========
  let state = {};

  function getSkillPool() {
    const pool = [...BASE_SKILLS];
    if (prestige.expandedPool) pool.push(...BONUS_SKILLS);
    return pool;
  }

  function getThreshold(level) {
    let t = 50;
    for (let i = 1; i < level; i++) t = Math.floor(t * 1.5);
    return t;
  }

  function initRun() {
    const baseMaxEndurance = 100 + prestige.enduranceBonus;
    state = {
      level: 1,
      points: 0,
      threshold: getThreshold(1),
      endurance: baseMaxEndurance,
      maxEndurance: baseMaxEndurance,
      baseClickCost: 1,
      clickCost: 1,
      basePointsPerClick: 1,
      pointsMultiplier: 1.0 * prestige.pointsMult,
      levelHeal: 0,
      healPerClick: 0,
      costReduction: 0,
      costIncrease: 0,
      skills: [],
      dead: false,
    };
    recalcStats();
    updateUI();
    document.getElementById('death-overlay').classList.remove('active');
    document.getElementById('levelup-overlay').classList.remove('active');
  }

  function recalcStats() {
    let costRed = 0, costInc = 0, maxEnd = 100 + prestige.enduranceBonus;
    let ptsMult = 1.0 * prestige.pointsMult, lvlHeal = 0, healClick = 0;

    for (const sk of state.skills) {
      const e = sk.effect;
      if (e.costReduction) costRed += e.costReduction;
      if (e.costIncrease) costInc += e.costIncrease;
      if (e.maxEndurance) maxEnd += e.maxEndurance;
      if (e.pointsMultAdd) ptsMult += e.pointsMultAdd;
      if (e.levelHeal) lvlHeal += e.levelHeal;
      if (e.healPerClick) healClick += e.healPerClick;
    }

    state.clickCost = Math.max(0.1, state.baseClickCost - costRed + costInc);
    state.pointsMultiplier = ptsMult;
    state.maxEndurance = maxEnd;
    state.levelHeal = lvlHeal;
    state.healPerClick = healClick;
    if (state.endurance > state.maxEndurance) state.endurance = state.maxEndurance;
  }

  // ========== UI UPDATE ==========
  const $ = id => document.getElementById(id);

  function updateUI() {
    $('souls-val').textContent = prestige.souls;
    $('level-val').textContent = state.level;
    $('points-val').textContent = Math.floor(state.points);
    $('points-next').textContent = state.threshold;
    $('endurance-val').textContent = Math.max(0, state.endurance).toFixed(1);
    $('endurance-max-val').textContent = state.maxEndurance.toFixed(0);

    // XP bar
    const xpPct = Math.min(100, (state.points / state.threshold) * 100);
    $('xp-bar-fill').style.width = xpPct + '%';

    // Endurance bar
    const endPct = Math.max(0, (state.endurance / state.maxEndurance) * 100);
    $('endurance-bar-fill').style.width = endPct + '%';

    if (endPct > 50) {
      $('endurance-bar-fill').style.background = 'linear-gradient(90deg, #40c040, #60e060)';
    } else if (endPct > 25) {
      $('endurance-bar-fill').style.background = 'linear-gradient(90deg, #d0a020, #f0c040)';
    } else {
      $('endurance-bar-fill').style.background = 'linear-gradient(90deg, #c03030, #e04040)';
    }

    // Skills display
    const sd = $('skills-display');
    sd.innerHTML = '';
    const counts = {};
    for (const sk of state.skills) {
      counts[sk.name] = (counts[sk.name] || 0) + 1;
    }
    for (const [name, count] of Object.entries(counts)) {
      const tag = document.createElement('span');
      tag.className = 'skill-tag';
      tag.textContent = count > 1 ? `${name} x${count}` : name;
      sd.appendChild(tag);
    }
  }

  // ========== CLICK HANDLING ==========
  function doClick(e) {
    if (state.dead) return;
    if (state.endurance <= 0) return;

    const pts = Math.floor(state.basePointsPerClick * state.pointsMultiplier);
    state.points += pts;
    state.endurance = Math.max(0, state.endurance - state.clickCost);

    if (state.healPerClick > 0) {
      state.endurance = Math.min(state.maxEndurance, state.endurance + state.healPerClick);
    }

    spawnFloatText(pts, e);
    spawnParticles(e);

    // Check level up
    if (state.points >= state.threshold) {
      levelUp();
    }

    // Check death
    if (state.endurance <= 0) {
      die();
    }

    updateUI();
  }

  function spawnFloatText(pts, e) {
    const area = $('click-area');
    const rect = area.getBoundingClientRect();
    const ft = document.createElement('div');
    ft.className = 'float-text';
    ft.textContent = '+' + pts;
    const offsetX = (Math.random() - 0.5) * 60;
    ft.style.left = (rect.width / 2 + offsetX - 20) + 'px';
    ft.style.top = '20px';
    area.appendChild(ft);
    setTimeout(() => ft.remove(), 1000);
  }

  function spawnParticles(e) {
    const area = $('click-area');
    const rect = area.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 40;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.left = (rect.width / 2 - 2) + 'px';
      p.style.top = (rect.height / 2 - 2) + 'px';
      const colors = ['#c8aa50', '#f0d060', '#d0a0ff', '#ff9060'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      area.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  // ========== LEVEL UP ==========
  function levelUp() {
    state.level++;
    state.points = 0;
    state.threshold = getThreshold(state.level);

    // Second souffle heal
    if (state.levelHeal > 0) {
      state.endurance = Math.min(state.maxEndurance, state.endurance + state.levelHeal);
    }

    // Glow effect
    $('click-btn').classList.add('level-up-glow');
    setTimeout(() => $('click-btn').classList.remove('level-up-glow'), 600);

    // Show skill choice
    showSkillChoice();
    updateUI();
  }

  function showSkillChoice() {
    const pool = getSkillPool();
    const choices = [];
    const indices = [];

    while (choices.length < 3 && choices.length < pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      if (!indices.includes(idx)) {
        indices.push(idx);
        choices.push(pool[idx]);
      }
    }

    const container = $('skill-choices');
    container.innerHTML = '';

    for (const skill of choices) {
      const card = document.createElement('div');
      card.className = 'skill-card';
      card.innerHTML = `<div class="skill-card-name">${skill.name}</div><div class="skill-card-desc">${skill.desc}</div>`;
      card.addEventListener('click', () => pickSkill(skill));
      container.appendChild(card);
    }

    $('levelup-overlay').classList.add('active');
  }

  function pickSkill(skill) {
    state.skills.push({ ...skill });
    recalcStats();
    $('levelup-overlay').classList.remove('active');
    updateUI();
  }

  // ========== DEATH & PRESTIGE ==========
  function die() {
    state.dead = true;
    const soulsEarned = state.level * 10;
    prestige.souls += soulsEarned;
    savePrestige();

    $('death-level').textContent = state.level;
    $('death-souls').textContent = soulsEarned;
    $('prestige-souls').textContent = prestige.souls;

    renderPrestigeUpgrades();
    $('death-overlay').classList.add('active');
  }

  function renderPrestigeUpgrades() {
    const container = $('prestige-upgrades');
    container.innerHTML = '';

    const upgrades = [
      {
        name: 'Endurance de depart +10',
        desc: `Actuel : +${prestige.enduranceBonus} | Cout : 50 Ames`,
        cost: 50,
        canBuy: prestige.souls >= 50,
        action: () => { prestige.enduranceBonus += 10; prestige.souls -= 50; }
      },
      {
        name: 'Points de depart x1.1',
        desc: `Actuel : x${prestige.pointsMult.toFixed(1)} | Cout : 75 Ames`,
        cost: 75,
        canBuy: prestige.souls >= 75,
        action: () => { prestige.pointsMult = +(prestige.pointsMult * 1.1).toFixed(4); prestige.souls -= 75; }
      },
      {
        name: 'Pool de competences elargi',
        desc: prestige.expandedPool ? 'Deja achete !' : 'Ajoute 2 competences bonus | Cout : 150 Ames',
        cost: 150,
        canBuy: !prestige.expandedPool && prestige.souls >= 150,
        soldOut: prestige.expandedPool,
        action: () => { prestige.expandedPool = true; prestige.souls -= 150; }
      }
    ];

    for (const u of upgrades) {
      const div = document.createElement('div');
      div.className = 'prestige-upgrade';
      div.innerHTML = `
        <div class="prestige-upgrade-info">
          <div class="prestige-upgrade-name">${u.name}</div>
          <div class="prestige-upgrade-desc">${u.desc}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'prestige-buy-btn' + (u.soldOut ? ' sold-out' : '');
      btn.textContent = u.soldOut ? 'Obtenu' : 'Acheter';
      btn.disabled = !u.canBuy;
      if (!u.soldOut) {
        btn.addEventListener('click', () => {
          u.action();
          savePrestige();
          $('prestige-souls').textContent = prestige.souls;
          renderPrestigeUpgrades();
        });
      }
      div.appendChild(btn);
      container.appendChild(div);
    }
  }

  // ========== INIT ==========
  $('click-btn').addEventListener('click', doClick);
  $('new-run-btn').addEventListener('click', () => initRun());

  initRun();
})();
</script>
</body>
</html>
